<div class="box" style="text-align: center; padding: 25px;">
    <h3 style="color: var(--accent);">Sincronización con Apple Health / Google Health Connect</h3>
    <p style="font-size: 12px; color: #555; margin-bottom: 20px;">
        Conecta los datos de tu smartwatch o anillo inteligente directamente desde tu teléfono al Instituto Aeterna sin costo ni aplicaciones intermediarias.
    </p>

    <button type="button" class="btn" style="background: var(--accent); color: white; padding: 12px 20px; font-size: 12px;" onclick="sincronizarDatosNativos()">
        🔄 Sincronizar Mis Datos de Salud
    </button>
</div>

<script>
    function sincronizarDatosNativos() {
        // Simulación de lectura de pasarela nativa del teléfono
        const datosSalud = {
            id_paciente: "p1",
            hrv: "72 ms",
            deep_sleep: "2h 10m",
            heart_rate: "58 lpm"
        };

        fetch('/api/paciente/sincronizar-salud-movil', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(datosSalud)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.mensaje);
            location.reload();
        });
    }
</script>
