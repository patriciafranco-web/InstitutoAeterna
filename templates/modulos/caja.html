<div class="box">
    <h3 style="color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-top: 0;">Caja y Registro de Ventas (Facturación Sifen)</h3>
    <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 20px;">Registro de transacciones y cobros vinculados al Sanatorio Le Blanc.</p>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div style="background: var(--bg-main); border: 1px solid var(--border); padding: 20px; border-radius: 8px;">
            <span style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: bold;">Total Recaudado Hoy</span>
            <div style="font-size: 24px; font-weight: bold; color: var(--success); margin-top: 8px;">₲ {{ "{:,.0f}".format(total_recaudado) if total_recaudado else '0' }}</div>
        </div>
    </div>
</div>
