<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start;">
    <div class="box" style="margin-bottom: 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px;">
            <h3 style="margin: 0; border: none; padding: 0; color: var(--accent);">Solicitar Exámenes Laboratoriales</h3>
            <span class="badge-bordo">LIS Sincronizado</span>
        </div>
        <form action="/api/medico/generar-orden-lab" method="POST">
            <input type="hidden" name="id_paciente" value="{{ p.id }}">
            <div style="max-height: 480px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px;">
                {% if laboratorios_aeterna %}
                    {% for categoria, items in laboratorios_aeterna.items() %}
                        <div style="margin-bottom: 15px; border-bottom: 1px dashed var(--border); padding-bottom: 10px;">
                            <h4 style="color: var(--accent); font-size: 12.5px; text-transform: uppercase; margin-bottom: 8px;">• {{ categoria }}</h4>
                            <div style="display: grid; grid-template-columns: 1fr; gap: 6px; padding-left: 10px;">
                                {% for item in items %}
                                    <label style="font-size: 12px; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; gap: 8px;">
                                        <input type="checkbox" name="estudios" value="{{ item }}" style="accent-color: var(--accent);"> {{ item }}
                                    </label>
                                {% endfor %}
                            </div>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>
            <button type="submit" class="btn" style="width: 100%;">Generar Orden Oficial Aeterna</button>
        </form>
    </div>

    <div class="box" style="margin-bottom: 0;">
        <h3 style="color: var(--accent); font-size: 13px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px;">Estudios Solicitados</h3>
        <div style="background: var(--bg-main); border: 1px solid var(--border); padding: 12px; border-radius: 6px;">
            <b style="font-size: 11px; color: var(--accent);">14/09/2026</b>
            <p style="font-size: 11.5px; margin: 0; color: var(--text-secondary);">Perfil Lipídico, Insulina Basal, HbA1c</p>
        </div>
    </div>
</div>
